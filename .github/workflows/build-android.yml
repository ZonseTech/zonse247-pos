name: Build Android Release

on:
    push:
        branches:
            - release/android-build
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            build_type:
                description: "Build type"
                required: true
                default: "release"
                type: choice
                options:
                    - release
                    - debug
            output_format:
                description: "Output format"
                required: true
                default: "apk"
                type: choice
                options:
                    - apk
                    - aab
                    - both

env:
    NODE_VERSION: "20"
    JAVA_VERSION: "17"

jobs:
    build-android:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Setup Java JDK
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: "gradle"

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Install dependencies
              run: npm ci

            - name: Create .env file
              run: |
                  cat << 'EOF' > .env
                  NODE_ENV=production
                  APPNAME=zonse247-pos
                  AUTO_SYNC_ENABLED=false

                  # client config
                  VITE_API_URL=http://127.0.0.1:3000/api/v1
                  VITE_APP_TITLE=Zonse247 POS
                  VITE_DEBUG_MODE=false
                  VITE_APP_CLIENT_TYPE=mobile

                  # API Configuration
                  API_VERSION=v1
                  API_PREFIX=/api
                  API_HOST=127.0.0.1
                  API_PORT=3000

                  SERVER_PORT=3000
                  SERVER_HOST=127.0.0.1
                  LIVE_API_URL=http://139.59.103.109:2025/api/v1
                  API_TIMEOUT=30000

                  # Server Configuration
                  TRUST_PROXY=true
                  SERVER_TIMEOUT=30000

                  # JWT Configuration
                  JWT_SECRET=${{ secrets.JWT_SECRET }}
                  JWT_EXPIRES_IN=24h
                  JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
                  JWT_REFRESH_EXPIRES_IN=7d

                  # Security Configuration
                  BCRYPT_SALT_ROUNDS=10
                  CORS_REQUEST_SIZE_LIMIT=10mb
                  CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000

                  # For local SQLite
                  DATABASE_OFFLINE_MODE=true
                  DATABASE_PROVIDER=sqlite
                  DATABASE_URL=file:./local.db
                  EOF

            - name: Build web app
              run: npm run build

            - name: Sync Capacitor
              run: npx cap sync android

            - name: Decode Keystore
              if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
              run: |
                  echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

            - name: Create keystore.properties
              if: github.event.inputs.build_type == 'release' || github.event_name == 'push'
              run: |
                  cat << EOF > android/keystore.properties
                  storeFile=release-keystore.jks
                  storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
                  keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
                  EOF

            - name: Make gradlew executable
              run: chmod +x android/gradlew

            - name: Build Debug APK
              if: github.event.inputs.build_type == 'debug'
              working-directory: android
              run: ./gradlew assembleDebug

            - name: Build Release APK
              if: (github.event.inputs.build_type == 'release' && github.event.inputs.output_format != 'aab') || (github.event_name == 'push' && github.event.inputs.output_format != 'aab')
              working-directory: android
              run: ./gradlew assembleRelease

            - name: Build Release Bundle (AAB)
              if: github.event.inputs.output_format == 'aab' || github.event.inputs.output_format == 'both'
              working-directory: android
              run: ./gradlew bundleRelease

            - name: Sign APK
              if: (github.event.inputs.build_type == 'release' && github.event.inputs.output_format != 'aab') || github.event_name == 'push'
              uses: r0adkll/sign-android-release@v1
              id: sign_apk
              with:
                  releaseDirectory: android/app/build/outputs/apk/release
                  signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  alias: ${{ secrets.ANDROID_KEY_ALIAS }}
                  keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
              env:
                  BUILD_TOOLS_VERSION: "34.0.0"

            - name: Get version from package.json
              id: package_version
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

            - name: Rename APK
              if: (github.event.inputs.build_type == 'release' && github.event.inputs.output_format != 'aab') || github.event_name == 'push'
              run: |
                  mkdir -p artifacts
                  cp ${{ steps.sign_apk.outputs.signedReleaseFile }} artifacts/zonse247-pos-v${{ steps.package_version.outputs.version }}.apk

            - name: Rename Debug APK
              if: github.event.inputs.build_type == 'debug'
              run: |
                  mkdir -p artifacts
                  cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/zonse247-pos-v${{ steps.package_version.outputs.version }}-debug.apk

            - name: Rename AAB
              if: github.event.inputs.output_format == 'aab' || github.event.inputs.output_format == 'both'
              run: |
                  mkdir -p artifacts
                  cp android/app/build/outputs/bundle/release/app-release.aab artifacts/zonse247-pos-v${{ steps.package_version.outputs.version }}.aab

            - name: Upload Debug APK
              if: github.event.inputs.build_type == 'debug'
              uses: actions/upload-artifact@v4
              with:
                  name: android-debug-apk
                  path: artifacts/*.apk
                  retention-days: 14

            - name: Upload Release APK
              if: (github.event.inputs.build_type == 'release' && github.event.inputs.output_format != 'aab') || github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: android-release-apk
                  path: artifacts/*.apk
                  retention-days: 30

            - name: Upload Release AAB
              if: github.event.inputs.output_format == 'aab' || github.event.inputs.output_format == 'both'
              uses: actions/upload-artifact@v4
              with:
                  name: android-release-aab
                  path: artifacts/*.aab
                  retention-days: 30

            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      artifacts/*.apk
                      artifacts/*.aab
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
