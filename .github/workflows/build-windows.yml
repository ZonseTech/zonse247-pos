name: Build Windows Installer

on:
  push:
    branches:
      - release/windows-build
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.3.0)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $VERSION"
            exit 1
          fi

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild

      - name: Create .env file
        run: |
          @"
          NODE_ENV=production
          APPNAME=zonse247-pos
          AUTO_SYNC_ENABLED=false

          # client config
          VITE_APP_ENV=production
          VITE_API_URL=http://127.0.0.1:3000/v1
          VITE_LIVE_API_URL=https://api.zonse247.com/v1
          VITE_APP_TITLE=Zonse247 POS
          VITE_DEBUG_MODE=false
          VITE_APP_CLIENT_TYPE=desktop
          VITE_MRA_ENVIRONMENT=PRODUCTION

          # API Configuration
          API_VERSION=v1
          API_PREFIX=/api
          API_HOST=127.0.0.1
          API_PORT=3000

          SERVER_PORT=3000
          SERVER_HOST=127.0.0.1
          LIVE_API_URL=https://api.zonse247.com/v1
          API_TIMEOUT=30000

          # Server Configuration
          TRUST_PROXY=true
          SERVER_TIMEOUT=30000

          # JWT Configuration
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=24h
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=7d

          # Security Configuration
          BCRYPT_SALT_ROUNDS=10
          CORS_REQUEST_SIZE_LIMIT=10mb
          CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:3001,https://api.zonse247.com,http://127.0.0.1:3000

          # Rate Limiting
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          AUTH_RATE_LIMIT_MAX=5
          ACCOUNT_CREATION_LIMIT=5

          # For local SQLite
          DATABASE_OFFLINE_MODE=true
          DATABASE_PROVIDER=sqlite
          DATABASE_URL=file:./local.db
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Build Windows Installer
        run: npm run release:win -- --publish never

      - name: Upload update files
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-installer/*.exe
            dist-installer/*.exe.blockmap
            dist-installer/latest.yml
          retention-days: 30

  deploy-updates:
    name: Publish update to pos.zonse247.com
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    concurrency:
      group: deploy-pos-updates
      cancel-in-progress: false

    steps:
      - name: Download update files
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release

      - name: Upload to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: release/*
          strip_components: 1
          target: pos-updates-incoming/${{ github.ref_name }}

      - name: Activate update
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: TAG
          script: |
            set -eu

            VERSION="${TAG#v}"
            DIR=/var/www/pos-updates
            IN="$HOME/pos-updates-incoming/$TAG"
            EXE="Zonse247_POS_Setup_${VERSION}.exe"
            cd "$IN"

            for f in "$EXE" "$EXE.blockmap" latest.yml; do
              [ -f "$f" ] || { echo "❌ Missing $f"; exit 1; }
            done
            grep -qx "version: $VERSION" latest.yml || { echo "❌ latest.yml is not $VERSION"; exit 1; }
            HASH="$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)"
            grep -q "sha512: $HASH" latest.yml || { echo "❌ Installer checksum does not match latest.yml"; exit 1; }

            if [ -f "$DIR/latest.yml" ]; then
              CURRENT="$(sed -n 's/^version: //p' "$DIR/latest.yml")"
              if [ "$CURRENT" = "$VERSION" ]; then
                if cmp -s latest.yml "$DIR/latest.yml"; then
                  ln -sfn "$EXE" "$DIR/Zonse247_POS_Setup.exe.next"
                  mv -Tf "$DIR/Zonse247_POS_Setup.exe.next" "$DIR/Zonse247_POS_Setup.exe"
                  echo "✅ $VERSION is already live"
                  rm -rf "$IN"
                  exit 0
                fi
                echo "❌ A different $VERSION is already live; bump the version"
                exit 1
              fi
              NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)"
              [ "$NEWEST" = "$VERSION" ] || { echo "❌ $VERSION is older than live $CURRENT"; exit 1; }
            fi

            mv -f "$EXE" "$EXE.blockmap" "$DIR/"
            mv -f latest.yml "$DIR/latest.yml.next"
            mv -Tf "$DIR/latest.yml.next" "$DIR/latest.yml"
            ln -sfn "$EXE" "$DIR/Zonse247_POS_Setup.exe.next"
            mv -Tf "$DIR/Zonse247_POS_Setup.exe.next" "$DIR/Zonse247_POS_Setup.exe"
            rm -rf "$IN"

            ls -1t "$DIR"/Zonse247_POS_Setup_*.exe | tail -n +4 | while read -r old; do
              rm -f "$old" "$old.blockmap"
            done

            LIVE="$(curl -fsS https://pos.zonse247.com/updates/latest.yml | sed -n 's/^version: //p')"
            [ "$LIVE" = "$VERSION" ] || { echo "❌ Public latest.yml shows $LIVE"; exit 1; }
            curl -fsSI https://pos.zonse247.com/updates/Zonse247_POS_Setup.exe > /dev/null || { echo "❌ Stable download link is not reachable"; exit 1; }
            echo "✅ Tills will update to $VERSION"

  release:
    needs: deploy-updates
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.exe
            ./artifacts/*.exe.blockmap
            ./artifacts/latest.yml
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
